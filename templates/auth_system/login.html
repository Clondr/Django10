{% extends 'base.html' %}

{% block title %}Увійти{% endblock %}

{% block content %}
  <div class="mx-auto max-w-lg">
      <div class="panel">
        <div class="panel-body">
          <h1 class="section-title">Увійти</h1>
          <form method="post">
            {% csrf_token %}
            <div class="field-group">
              <label for="username" class="field-label">Ім'я користувача</label>
              <input type="text" class="input-control" id="username" name="username" required>
            </div>
            <div class="field-group">
              <label for="password" class="field-label">Пароль</label>
              <input type="password" class="input-control" id="password" name="password" required>
            </div>
            <button type="submit" class="button-primary">Увійти</button>
          </form>
        </div>
      </div>
  </div>
{% endblock %}
