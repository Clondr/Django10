{% extends "base.html" %}
{% block title %}Редагування профілю{% endblock %}
{% block content %}
  <h1 class="display-title">Змінити профіль</h1>
  <form class="panel panel-body form-stack" method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="action-row">
      <button class="button-primary" type="submit">Завантажити</button>
      <button class="button-secondary" type="submit" name="reset_avatar" value="1">Скинути аватар</button>
    </div>
  </form>
    <h2 class="section-title mt-8">Змінити біографію</h2>
    <form class="panel panel-body form-stack" method="post">
        {% csrf_token %}
        <div class="field-group">
          <label for="bio" class="field-label">Біографія</label>
          <textarea class="input-control" id="bio" name="bio" rows="3">{{ profile.bio }}</textarea>
        </div>
        <button class="button-primary" type="submit">Зберегти</button>
    </form>
    <h2 class="section-title mt-8">Змінити ім'я</h2>
    <form class="panel panel-body form-stack" method="post">
        {% csrf_token %}
        <div class="field-group">
          <label for="first_name" class="field-label">Ім'я</label>
          <input class="input-control" type="text" id="first_name" name="first_name" value="{{ request.user.first_name }}">
        </div>
        <div class="field-group">
          <label for="last_name" class="field-label">Прізвище</label>
          <input class="input-control" type="text" id="last_name" name="last_name" value="{{ request.user.last_name }}">
        </div>
        <button class="button-primary" type="submit">Зберегти</button>
{% endblock %}
