{% extends "base.html" %}
{% block title %} Додати учасника до чату {% endblock %}

{% block content %}
    <h1 class="display-title">Додати учасника до чату</h1>
    <p class="muted-copy">Чат: {{ chat.id }}</p>
    <form class="panel panel-body form-stack max-w-xl" method="post" action="{% url 'add-participant-to-chat' %}">
        {% csrf_token %}
        <div class="field-group">
            <input type="hidden" name="chat_id" value="{{ chat.id }}">
            <label for="participant_id" class="field-label">Користувач</label>
            <select class="input-control" id="participant_id" name="participant_id" required>
                {% for user in users %}
                <option value="{{ user.id }}">{{ user.user.username }}</option>
                {% empty %}
                <option disabled>Немає доступних користувачів</option>
                {% endfor %}
            </select>
        </div>
        <button type="submit" class="button-primary"{% if not users %} disabled{% endif %}>Додати учасника</button>
    </form>
{% endblock %}
