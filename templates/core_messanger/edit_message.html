{% extends "base.html" %}
{% block title %}Редагування повідомлення{% endblock %}
{% block content %}
    <h1 class="display-title">Редагувати повідомлення</h1>
    <form class="panel panel-body form-stack max-w-2xl" method="post" data-encrypted-edit-form data-key-url="{% url 'register-public-key' %}" data-recipient-public-key="{{ recipient_public_key|escape }}" data-sender-public-key="{{ message.sender_public_key|escape }}" data-ciphertext="{{ message.ciphertext }}" data-nonce="{{ message.nonce }}">
        {% csrf_token %}
        <div class="field-group">
        <label for="content" class="field-label">Зміст повідомлення</label>
        <textarea class="input-control" id="content" name="content" rows="3">Расшифровка...</textarea>
        <input type="hidden" name="ciphertext">
        <input type="hidden" name="nonce">
        <input type="hidden" name="self_ciphertext">
        <input type="hidden" name="self_nonce">
        <input type="hidden" name="public_key">
        </div>
        <button class="button-primary" type="submit">Зберегти</button>
        <div class="encryption-status muted-copy" role="status"></div>
    </form>
    {% endblock %}
